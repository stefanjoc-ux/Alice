# On every push to main: run all the tests (SQLite and PostgreSQL) INSIDE the container image, push the image, and
# deploy it to Azure as a new revision with NO traffic. Stefan moves traffic with deploy/promote.ps1 (or the portal);
# rollback = move it back. Azure sign-in is OIDC (federated credential), so no Azure secrets are stored in GitHub.
name: test-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: alice, POSTGRES_PASSWORD: alice-test-only, POSTGRES_DB: alice_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alice" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t alice:${{ github.sha }} .
      - name: Tests inside the image (SQLite)
        run: docker run --rm -e ALICE_ROLE=test alice:${{ github.sha }}
      - name: Tests inside the image (PostgreSQL)
        run: >-
          docker run --rm --network host -e ALICE_ROLE=test
          -e ALICE_TEST_DATABASE_URL="postgresql://alice:alice-test-only@127.0.0.1:5432/alice_test"
          alice:${{ github.sha }}
      - name: Save the tested image
        run: docker save alice:${{ github.sha }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: image, path: image.tar.gz, retention-days: 3 }

  deploy:
    needs: test-image
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: image }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push the tested image (the same one, not a rebuild)
        run: |
          TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          gunzip -c image.tar.gz | docker load
          az acr login -n "${{ vars.ACR_NAME }}"
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/alice:$TAG"
          docker tag alice:${{ github.sha }} "$IMAGE" && docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"; echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: New revisions with no traffic
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          az extension add --name containerapp --upgrade --only-show-errors
          for APP in alice-web alice-mcp; do
            LIVE=$(az containerapp ingress traffic show -n "$APP" -g "$RG" --query "[?weight>\`0\`].revisionName | [0]" -o tsv)
            if [ -n "$LIVE" ]; then   # pin traffic to the live revision before adding the new one
              az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$LIVE=100" --only-show-errors -o none
            fi
            az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" --revision-suffix "r$TAG" --only-show-errors -o none
            echo "$APP: new revision $APP--r$TAG (no traffic); live stays $LIVE"
          done
          for JOB in alice-migrate-check alice-migrate-apply; do
            az containerapp job update -n "$JOB" -g "$RG" --image "$IMAGE" --only-show-errors -o none || true
          done
          echo "### Ready to go live: alice:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Run \`.\\deploy\\promote.ps1 -SubscriptionId <id>\` on the PC to move traffic to it." >> "$GITHUB_STEP_SUMMARY"

# On a pull request into main: run all the tests only (nothing is deployed), so a change can be checked before the owner merges it,
# and check that a change to code adds its line to CHANGELOG.md (job changelog).
# On every push to main (a merged pull request): run all the tests (SQLite and PostgreSQL) INSIDE the container image, push the image, and
# deploy it to Azure as a new revision with NO traffic, then put it live automatically (same health checks as the Go live
# button; switch off with the repository variable AUTO_PROMOTE=false). Rollback = the Go live button, rollback. Azure sign-in is OIDC (federated credential), so no Azure secrets are stored in GitHub.
name: test-and-deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A newer push cancels an older run still going, so an older build can never end up as the "newest" revision.
# Pull requests have their own lane, so checking one never cancels a release.
concurrency:
  group: test-and-deploy-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: true

jobs:
  # Pull requests only: a change to code carries its line in CHANGELOG.md (deploy/changelog_check.py). Documentation-only
  # and test-only changes pass without one. The release's own entries are read by Alice when it starts (changelog.py).
  changelog:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: A code change carries its CHANGELOG.md entry
        run: python3 deploy/changelog_check.py --base "origin/${{ github.base_ref }}"

  test-image:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Docker's official image from Amazon's public mirror (the same image): Docker Hub refuses anonymous pulls from GitHub's
        # runners once its shared limit is reached (9 Oct 2026), which failed pull requests before any test ran.
        image: public.ecr.aws/docker/library/postgres:16
        env: { POSTGRES_USER: alice, POSTGRES_PASSWORD: alice-test-only, POSTGRES_DB: alice_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alice" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build --build-arg ALICE_VERSION=$(echo "${{ github.sha }}" | cut -c1-7) --build-arg ALICE_BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ) --build-arg ALICE_REPO_URL=${{ github.server_url }}/${{ github.repository }} -t alice:${{ github.sha }} .
      - name: Tests inside the image (SQLite)
        run: docker run --rm -e ALICE_ROLE=test alice:${{ github.sha }}
      - name: Tests inside the image (PostgreSQL)
        run: >-
          docker run --rm --network host -e ALICE_ROLE=test
          -e ALICE_TEST_DATABASE_URL="postgresql://alice:alice-test-only@127.0.0.1:5432/alice_test"
          alice:${{ github.sha }}
      - name: Save the tested image
        run: docker save alice:${{ github.sha }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v6
        with: { name: image, path: image.tar.gz, retention-days: 3 }

  deploy:
    needs: test-image
    if: ${{ vars.AZURE_CLIENT_ID != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5          # for deploy/promote.sh
      - uses: actions/download-artifact@v7
        with: { name: image }
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push the tested image (the same one, not a rebuild)
        run: |
          TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          gunzip -c image.tar.gz | docker load
          az acr login -n "${{ vars.ACR_NAME }}"
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/alice:$TAG"
          docker tag alice:${{ github.sha }} "$IMAGE" && docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"; echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: New revisions with no traffic
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          az extension add --name containerapp --upgrade --only-show-errors
          for APP in alice-web alice-mcp; do
            # The revision taking traffic, by name (traffic may be set as "latest revision", e.g. after the setup script's apps step)
            LIVE=$(az containerapp revision list -n "$APP" -g "$RG" --query "[?properties.trafficWeight>\`0\`].name | [0]" -o tsv)
            if [ -n "$LIVE" ]; then   # pin traffic to the live revision before adding the new one
              az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$LIVE=100" --only-show-errors -o none
            fi
            az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" --revision-suffix "r$TAG" --only-show-errors -o none
            echo "$APP: new revision $APP--r$TAG (no traffic); live stays $LIVE"
          done
          # alice-backup (the nightly off-site copy) and alice-drill (the restore drill), from azure-setup -Step backup, run the same image
          for JOB in alice-migrate-check alice-migrate-apply alice-backup alice-drill; do
            az containerapp job update -n "$JOB" -g "$RG" --image "$IMAGE" --only-show-errors -o none || true
          done
          echo "### Deployed (no traffic yet): alice:$TAG" >> "$GITHUB_STEP_SUMMARY"
      # Automatic go-live: on unless the repository variable AUTO_PROMOTE is 'false'. Same checks as the button (both apps
      # or neither, Healthy, /healthz answered); if they fail, nothing changes and this run shows red. Roll back with the button.
      - name: Go live automatically
        if: ${{ vars.AUTO_PROMOTE != 'false' }}
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          PROMOTE_WAIT: '1'
        run: |
          echo "### Going live automatically" >> "$GITHUB_STEP_SUMMARY"
          bash deploy/promote.sh promote
      # The demo Alice (client demos, if it has been set up with azure-setup -Step demo) follows every release. It has
      # one revision at a time and only fictional data, so it simply moves to the new image.
      - name: Update the demo Alice
        if: ${{ success() }}
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          for APP in alice-demo-web alice-demo-mcp; do
            if az containerapp show -n "$APP" -g "$RG" --query name -o tsv >/dev/null 2>&1; then
              az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" --only-show-errors -o none && echo "$APP: now alice:$TAG"
            fi
          done
